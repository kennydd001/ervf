purpose: >-
  Exhaustieve inventaris van de hypotheses uit de aangeleverde prompt en
  bronbestanden. Een idee geldt alleen als gesloten wanneer er een resultaat,
  falsificatiegrens en controleerbaar bewijsbestand bestaat. Een lokaal
  onuitvoerbaar idee blijft expliciet geblokkeerd en telt niet als getest.

status_legend:
  verified_pass: fysiek uitgevoerd, grens gehaald en onafhankelijk gecontroleerd
  verified_pass_quality: full-depth kwaliteitspoort gehaald, maar fysieke runtimeclaim nog niet getest
  verified_negative: fysiek uitgevoerd, hypothese gefalsificeerd en gecontroleerd
  superseded: premisse weerlegd of vervangen door een sterkere fysieke test
  queued: lokaal uitvoerbaar en nog niet gesloten
  blocked_artifact: benodigd model of referentiebestand ontbreekt
  blocked_hardware: benodigd apparaat ontbreekt
  blocked_measurement: benodigde energie- of systeemmeter ontbreekt
  blocked_scope: vereist training of een onderzoeksprogramma buiten checkpoint-evaluatie

