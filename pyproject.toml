[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-compiler-lab"
version = "0.1.0"
description = "Reproducible experiments for activation-space MoE compression"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "psutil>=6.0",
  "scipy>=1.18",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
