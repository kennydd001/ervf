      stored per (node, slot) and summed in route order, so per-node accumulation
      order is unchanged. runtime.py untouched.
    preregistration: reports/lightningstream_nemotron/X1_SWEEPSPEC_MOE_ORACLE_PREREGISTRATION_2026-08-15.md
    result: reports/lightningstream_nemotron/x1_sweepspec_moe_oracle.json
    independent_verification: reports/lightningstream_nemotron/x1_independent_verification.json
    independent_verification_score: "35/35"
    report: reports/lightningstream_nemotron/X1_SWEEPSPEC_MOE_ORACLE_REPORT_2026-08-15.md
    protected_verdict: PROTECTED_80B_INTACT
    gates:
      G-X1-C1_batched_equals_gemv: pass (bit-identical, B up to 8)
      G-X1-C2_sweep_equals_sequential: pass (460 layer-blocks, 0 mismatches, rel_l2 0.0)
      G-X1-P1_ratio: FAIL (1.0017 against a required 0.6228)
      G-X1-D1_drift: conclusive at every B
    measured:
      ratio_sweep_over_seq: {B1: 1.1465, B2: 1.0753, B3: 1.0343, B4: 1.0192, B5: 1.0017}
      seq_p50_ms: {B1: 22.454, B2: 43.993, B3: 66.580, B4: 88.799, B5: 111.359}
      seq_scaling_vs_B1: {B5: 4.959}
      mean_union_per_layer: {B1: 6.00, B5: 18.85}
      ms_per_emitted_token: {B1: 22.45, B2: 24.63, B3: 27.99, B4: 31.62, B5: 35.76}
    mechanism_conclusion: >
      The MoE term is linear in the number of (node, expert) ASSIGNMENTS, not in
      the number of unique expert records: loading each record 18.85 instead of 30
      times per layer buys nothing, because reading records is not where the time
      is. Third independent confirmation after S11 and S12. Consequence: the
      routed-expert part alone of a B=5 verification costs 111.5 ms, 1.8x the whole
      62.280 ms round budget for 50 tok/s, before router, shared, Mamba, attention,
      LM head and draft. And because cost follows B while yield is 1+A, even
      PERFECT acceptance (A=4 at B=5) only breaks even at 22.3 vs 22.45 ms per
      emitted token, before draft cost. No drafter improvement can make
      speculation pay on this runtime. This closes SweepSpec, ExactFlow-E and
      LightningSpec H2/H3/H4/H6/H7/H8 as routes to 50 tok/s.

