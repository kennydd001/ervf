project: STREAMQ5_MOE_NEXT_WAVE
created_at: 2026-08-12
baseline: reports/streamq5_moe/P13_EVT_PM_EUREKA_REPORT_2026-08-12.md
rule: >-
  Deze registry wijzigt de gesloten 48-itemcampagne niet. Iedere nieuwe
  kandidaat krijgt vóór uitvoering een preregistratie en een afzonderlijke
  status. Oude P7-kostenprojecties gelden niet automatisch na P13.

status_legend:
  queued: lokaal toetsbaar, nog niet gesloten
  in_progress: preregistratie vastgelegd en uitvoering gestart
  verified_pass: fysieke poort gehaald
  verified_pass_component: fysieke component- of structuurpoort gehaald; nog geen end-to-end claim
  verified_baseline: bestaande fysieke run sluit de baseline, maar test nog geen nieuwe versnelling
  verified_negative: fysieke of empirische poort gefaald
  superseded: reeds door later/sterker bestaand bewijs afgedekt
  blocked_artifact: vereist ontbrekend model of drafter
  blocked_hardware: vereist ontbrekende GPU of meetapparatuur
  blocked_scope: vereist een afzonderlijk groot implementatie- of trainingsproject

