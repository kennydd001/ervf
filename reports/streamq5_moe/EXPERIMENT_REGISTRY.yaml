claim_boundary:
  - P0C proves full-depth quality for the exact physical BF16-scale decode semantics.
  - P1D proves the complete physical Q5 bank and immutable-source equivalence.
  - P2A and P2C prove the physical expert kernel, co-residency, cache traffic, and H2D.
  - P3A proves the integrated routed-expert data plane only.
  - P4A proves bit-exact causal same-layer overlap and a 1.402x speedup, but its locked 20-ms mean gate narrowly failed.
  - P5A proves the physical INT8 q/k/v/o/router/head bank, co-residency, correctness, and projection-plane wall-clock.
  - P5A's bank code-selection order is not P0C-identical; P6 replaces it with an independently verified exact-semantic bank.
  - P6B proves local full-depth physical quality and strict end-to-end batch-1 decode, including embedding, attention/KV, live weighted routing, sampling, and 512-token feedback.
  - The claim does not generalize to other hardware, batch sizes above one, contexts above 4096, other models, or universal quality.
