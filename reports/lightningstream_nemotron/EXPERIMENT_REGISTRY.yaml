stop_rules:
  - id: identity_unprovable
    action: keep tracks separate, do not block local work
  - id: one_module_semantics_unreproducible
    action: debug implementation only; make no quality conclusion
  - id: zero_cache_p95_over_60ms
    condition: after registered/batched transfer and a correct fused kernel
    action: reassess physical architecture before building a full model
  - id: full_4k_below_15_tok_s
    action: do not open 128K/256K performance claims
  - id: runtime_quality_loss_beyond_checkpoint
    action: fix semantics; never mask with prompt tuning
  - id: context_128k_state_does_not_fit
    action: report actual maximum context; do not extrapolate
  - id: protected_80b_file_changed
    action: STOP IMMEDIATELY, restore from manifest, do not touch the other agent's work

forbidden_hypotheses:
  - shared or low-rank expert surrogates (RSIV falsified_rank_working_set)
  - post-hoc hidden-state correction
  - Q2 CORETAIL as model semantics (+42.943% test relative CE)
  - CRAFT route substitution as a primary method
  - dynamic Q3/Q4 selectors
  - atom skipping or neuron sparsity as the baseline (pruning cost is ~linear in removed fraction)
  - speculative block-coalescing before an ordinary decoder exists
  - multiplying local oracle gains without one full-depth candidate
  - recomputed topk as authoritative routing when the official block returned IDs
  - naming a residual/"glue" term without measuring it independently
  - promoting a microkernel or component projection to tokens per second
  - "speculative block verification on this runtime (X1: MoE cost is linear in verified positions, not unique experts, so even perfect acceptance only breaks even before draft cost)"
  - "expert-major grouping as a speed optimisation (X1: sweep/sequential ratio 1.0017 at B=5 against a required 0.6228)"
  - "full-record expert caching at equal cache bytes (S11: -4.84% at 262100; halving capacity costs more in misses than the dropped gathers save)"
  - "treating a probe that contains a synchronisation as a component cost without matching where the real synchronisation sits in the loop (S12 router probe)"
  - "isolated component timing as attribution on this runtime (S8: overcounts by 16.9 ms at 262K because the sync destroys the loop's overlap)"
